#
# Real-Time Optimization Configuration Fragment
# ColorCreator Project - Motor Control
#
# Purpose: Optimize Allwinner T113-S3 kernel for controlling 20 stepper motors
# Target: Low latency, deterministic timing, minimal jitter
#

# ============================================================================
# CRITICAL: Preemption Model
# ============================================================================
# Change from PREEMPT_NONE (server-oriented) to PREEMPT_VOLUNTARY (desktop-oriented)
# This allows kernel code to be preempted at explicit preemption points
#
# Impact:
# - Before: Latency 10-50ms, high jitter
# - After:  Latency 1-5ms, reduced jitter
#
CONFIG_PREEMPT_NONE is not set
CONFIG_PREEMPT_VOLUNTARY=y

# Note: If PREEMPT_RT is available in kernel 6.5.5, use this instead:
# CONFIG_PREEMPT_RT=y
# Check with: grep -r "PREEMPT_RT" in kernel source

# ============================================================================
# CRITICAL: Timer Frequency (HZ)
# ============================================================================
# Change from HZ=100 (10ms tick) to HZ=1000 (1ms tick)
# This dramatically improves timing resolution
#
# Impact:
# - Before: 10ms resolution (unusable for precise motor control)
# - After:  1ms resolution (acceptable for most motor tasks)
#
CONFIG_HZ_100 is not set
CONFIG_HZ_250 is not set
CONFIG_HZ_1000=y
CONFIG_HZ=1000

# ============================================================================
# CPU Frequency Scaling
# ============================================================================
# Lock CPU at maximum frequency to avoid frequency scaling delays
# Dynamic frequency scaling introduces unpredictable latency
#
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL is not set

# Alternative: Use 'userspace' governor if you need manual control
# CONFIG_CPU_FREQ_DEFAULT_GOV_USERSPACE=y

# ============================================================================
# NO_HZ (Tickless) Configuration
# ============================================================================
# Enable full tickless mode for isolated CPUs
# This allows removing periodic timer ticks from isolated CPUs
#
# Requires kernel parameter: nohz_full=1
#
CONFIG_NO_HZ_FULL=y
CONFIG_NO_HZ_IDLE is not set

# ============================================================================
# PWM Driver (Embed in kernel instead of module)
# ============================================================================
# Critical for motor control - don't load as module
#
CONFIG_PWM_SUN4I=y

# ============================================================================
# Real-Time Debugging and Tracing (Optional - disable in production)
# ============================================================================
# These help diagnose latency issues during development
# Disable in production for minimal overhead
#

# Preemption debugging
CONFIG_DEBUG_PREEMPT=y

# Tracers for latency analysis
CONFIG_PREEMPT_TRACER=y
CONFIG_IRQSOFF_TRACER=y
CONFIG_SCHED_TRACER=y
CONFIG_FTRACE=y

# Latency measurement
CONFIG_LATENCYTOP=y

# Function tracer (helpful for finding latency sources)
CONFIG_FUNCTION_TRACER=y
CONFIG_FUNCTION_GRAPH_TRACER=y

# ============================================================================
# RCU (Read-Copy-Update) Optimization
# ============================================================================
# These work with rcu_nocbs kernel parameter
#
CONFIG_RCU_NOCB_CPU=y
CONFIG_RCU_BOOST=y
CONFIG_RCU_BOOST_DELAY=500

# ============================================================================
# IRQ Threading
# ============================================================================
# Already enabled in base config - confirm it stays enabled
CONFIG_IRQ_FORCED_THREADING=y

# ============================================================================
# Additional RT-friendly options
# ============================================================================

# Reduce scheduling period for better responsiveness
CONFIG_FAIR_GROUP_SCHED=n

# Disable CPU idle states that add latency
# CONFIG_CPU_IDLE is not set  # Uncomment if you need absolute minimal latency

# Lock kernel pages in memory (reduce page faults)
CONFIG_LOCK_KERNEL_MEMORY=y

# ============================================================================
# NOTES FOR KERNEL COMMAND LINE
# ============================================================================
# Add these to your kernel command line in machine config:
#
# isolcpus=1          - Isolate CPU1 from scheduler
# nohz_full=1         - No periodic tick on CPU1
# rcu_nocbs=1         - RCU callbacks don't run on CPU1
# processor.max_cstate=1  - Limit C-states for lower latency
#
# Example in machine config:
# APPEND += "isolcpus=1 nohz_full=1 rcu_nocbs=1 processor.max_cstate=1"
#
