<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColorCreator</title>
</head>
<body>
<script>
  fetch('/cgi-bin/status.cgi?ts=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(s => {
      const mode = (s && s.mode) ? String(s.mode) : 'ap';
      const hasIp = !!(s && s.ip);
      if (mode === 'client' && hasIp) {
        location.replace('/status.html');
      } else {
        location.replace('/config.html');
      }
    })
    .catch(() => location.replace('/config.html'));
</script>
<div style="text-align:center;padding:48px;font-family:system-ui, sans-serif;">
  <h2>🎨 ColorCreator</h2>
  <p>Loading…</p>
</div>
</body>
</html>
