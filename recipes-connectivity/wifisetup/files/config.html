<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>ColorCreator Wi-Fi Setup</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px
    }
    .container{
      background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);
      padding:32px;max-width:560px;width:100%
    }
    h1{color:#667eea;text-align:center;margin-bottom:8px;font-size:28px}
    .subtitle{color:#666;text-align:center;margin-bottom:18px;font-size:14px}
    .row{display:flex;gap:10px;align-items:center}
    button{
      padding:12px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;
      transition:.2s; font-size:14px
    }
    button:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
    .btn-ghost{background:#f2f3f7;color:#333}
    .netlist{margin-top:14px;border:1px solid #eee;border-radius:12px;overflow:hidden}
    .net{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}
    .net:last-child{border-bottom:none}
    .net:hover{background:#fafafa}
    .ssid{font-weight:700;color:#222}
    .meta{font-family:monospace;color:#666;font-size:12px}
    .pill{padding:2px 8px;border-radius:999px;font-size:12px;background:#f2f3f7;color:#333}
    .pill.lock{background:#ffe9e9;color:#8a1f1f}
    .pill.open{background:#e9fff0;color:#1f6b2e}
    .form{margin-top:18px;padding:14px;border-radius:12px;background:#f7f7fb;border:1px solid #eee}
    label{display:block;color:#555;font-size:12px;margin-bottom:6px;font-weight:700}
    input{
      width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:14px
    }
    .hint{color:#666;font-size:12px;margin-top:10px;line-height:1.4}
    .err{margin-top:12px;color:#b00020;font-size:13px;display:none}
    .ok{margin-top:12px;color:#1f6b2e;font-size:13px;display:none}
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 ColorCreator</h1>
    <p class="subtitle">Connect the device to your Wi-Fi</p>
    <div class="row">
      <button class="btn-primary" id="scanBtn">📡 Scan networks</button>
      <button class="btn-ghost" id="refreshBtn">🔄 Refresh</button>
    </div>
    <div id="err" class="err"></div>
    <div id="ok" class="ok"></div>
    <div class="netlist" id="netlist" style="display:none;"></div>
    <form class="form" id="form" action="/cgi-bin/config.cgi" method="POST" style="display:none;">
      <input type="hidden" name="ssid" id="ssidField" />
      <div style="margin-bottom:12px;">
        <label>Selected network (SSID)</label>
        <input type="text" id="ssidDisplay" disabled />
      </div>
      <div id="passWrap" style="margin-bottom:12px;">
        <label>Password</label>
        <input type="password" name="password" id="passField" placeholder="Wi-Fi password" />
      </div>
      <button class="btn-primary" type="submit" style="width:100%;">✅ Connect</button>
      <div class="hint">
        After connection, open <b>http://color.local</b> (preferred) or check your router for the device IP.
      </div>
    </form>
  </div>
<script>
  const scanBtn = document.getElementById('scanBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const netlist = document.getElementById('netlist');
  const form = document.getElementById('form');
  const ssidField = document.getElementById('ssidField');
  const ssidDisplay = document.getElementById('ssidDisplay');
  const passWrap = document.getElementById('passWrap');
  const passField = document.getElementById('passField');
  const err = document.getElementById('err');
  const ok = document.getElementById('ok');
  function showErr(msg){
    err.style.display = 'block';
    err.textContent = msg;
    ok.style.display = 'none';
  }
  function showOk(msg){
    ok.style.display = 'block';
    ok.textContent = msg;
    err.style.display = 'none';
  }
  function sortBySignal(a,b){ return (b.signal||-999) - (a.signal||-999); }
  function renderNetworks(list){
    netlist.innerHTML = '';
    if(!list || !list.length){
      showErr('No networks found. Try again.');
      netlist.style.display = 'none';
      return;
    }
    err.style.display = 'none';
    netlist.style.display = 'block';
    list.sort(sortBySignal).forEach(n => {
      const div = document.createElement('div');
      div.className = 'net';
      const left = document.createElement('div');
      const ss = document.createElement('div');
      ss.className = 'ssid';
      ss.textContent = n.ssid || '(hidden SSID)';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = (typeof n.signal === 'number' ? (n.signal + ' dBm') : 'signal: ?');
      left.appendChild(ss); left.appendChild(meta);
      const right = document.createElement('div');
      const sec = String(n.security || 'open');
      const pill = document.createElement('span');
      pill.className = 'pill ' + (sec === 'open' ? 'open' : 'lock');
      pill.textContent = (sec === 'open') ? 'open' : sec;
      right.appendChild(pill);
      div.appendChild(left);
      div.appendChild(right);
      div.addEventListener('click', () => {
        const ssid = n.ssid || '';
        if(!ssid){ showErr('This network has a hidden SSID.'); return; }
        ssidField.value = ssid;
        ssidDisplay.value = ssid;
        if (sec === 'open') {
          passWrap.style.display = 'none';
          passField.value = '';
        } else {
          passWrap.style.display = 'block';
        }
        form.style.display = 'block';
        showOk('Selected: ' + ssid);
      });
      netlist.appendChild(div);
    });
  }
  function scan(){
    showOk('Scanning…');
    fetch('/cgi-bin/scan.cgi?ts=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(list => renderNetworks(list))
      .catch(e => showErr('Scan failed: ' + (e && e.message ? e.message : e)));
  }
  scanBtn.addEventListener('click', scan);
  refreshBtn.addEventListener('click', scan);
  scan();
</script>
</body>
</html>
