#@TYPE: Machine
#@NAME: LCPI-PC-T113
#@DESCRIPTION: Machine configuration for LCPI-PC-T113 board (Allwinner T113-S3)

# Include base machine config from meta-lcpi-pc-t113 if it exists
# This file adds ColorCreator specific configurations

# Serial console configuration - CRITICAL for boot
SERIAL_CONSOLES = "115200;ttyS0"
SERIAL_CONSOLE = "115200 ttyS0"

# Kernel boot arguments
KERNEL_BOOTARGS = "console=ttyS0,115200 earlyprintk root=/dev/mmcblk0p2 rootwait rw"

# Boot arguments for u-boot
UBOOT_BOOTARGS = "console=ttyS0,115200 earlyprintk root=/dev/mmcblk0p2 rootwait rw"

# Extra kernel config
KERNEL_EXTRA_ARGS += "console=ttyS0,115200"
